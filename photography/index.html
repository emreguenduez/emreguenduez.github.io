---
title: Photography · M. Emre Gündüz
wide: true
---
<header>
  <h1>Photography</h1>
  <p class="lead">Photo books of places I've been. Open one and flip through.</p>
</header>

<div class="books" id="books"></div>
<p class="empty" id="no-books" hidden>No photo books yet.</p>

<dialog class="viewer" aria-label="Photo book"></dialog>

<script id="books-data" type="application/json">{{ site.data.books | jsonify | replace: "</", "<\/" }}</script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="{{ '/book.js' | relative_url }}"></script>
<script>
  const books = JSON.parse(document.getElementById('books-data').textContent || '[]') || [];
  const viewer = document.querySelector('.viewer');
  viewer.innerHTML = BOOK_VIEWER_HTML;
  const src = p => '{{ site.baseurl }}' + p;

  document.getElementById('books').append(...books.map(b => {
    const a = bookEl('a', 'book');
    a.href = '#' + b.id;
    a.append(bookBox(renderBookCover(b, src)));
    a.append(bookEl('h3', '', b.title || 'Untitled'));
    a.append(bookEl('span', 'meta', (b.pages || []).length + ' pages'));
    return a;
  }));
  document.getElementById('no-books').hidden = books.length > 0;

  // The hash (#book-id) opens a book, so links to a single book can be shared.
  const route = () => {
    const b = books.find(b => '#' + b.id === location.hash);
    if (b && !viewer.open) openBook(viewer, b, src);
  };
  viewer.addEventListener('close', () => history.replaceState(null, '', location.pathname));
  addEventListener('hashchange', route);
  route();
</script>
