# Rebuilds resume.pdf whenever the resume or its styles change (including saves from /admin/),
# so "Download PDF" serves a real file that works on phones, where window.print() often does nothing.
name: Resume PDF

on:
  push:
    branches: [main]
    paths:
      - _data/resume.json
      - _data/resume_de.json
      - _data/resume_tr.json
      - _data/i18n.yml
      - _includes/**
      - de/**
      - tr/**
      - resume.js
      - style.css
      - index.html
      - _layouts/**
      - fonts/**
      - _config.yml
      - .github/workflows/resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: |
          gem install jekyll --no-document
          jekyll build -d _site

      - name: Print the resume to PDF
        run: |
          # metric-compatible stand-ins for the Helvetica/Arial used for dates in print
          sudo apt-get install -y -q fonts-liberation >/dev/null
          python3 -m http.server 4000 -d _site >/dev/null 2>&1 &
          sleep 2
          # one PDF per language: / → resume.pdf, /de/ → resume-de.pdf, /tr/ → resume-tr.pdf
          for pair in ":resume.pdf" "de/:resume-de.pdf" "tr/:resume-tr.pdf"; do
            path="${pair%%:*}"; out="${pair##*:}"
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --virtual-time-budget=10000 --print-to-pdf="$out" "http://localhost:4000/$path"
            pages=$(python3 -c "import re,sys; print(len(re.findall(rb'/Type\s*/Page[^s]', open(sys.argv[1],'rb').read())))" "$out")
            echo "$out: $pages page(s)"
            if [ "$pages" != "1" ]; then echo "::warning::$out has $pages pages; it should fit on one."; fi
          done

      - name: Commit the PDF
        # this job only runs when the resume or its styles changed, so the PDF is always worth replacing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf resume-de.pdf resume-tr.pdf
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update resume PDFs"
          git pull --rebase --autostash origin main
          git push

      - name: Publish
        # pushes made with the workflow token don't always start a Pages build on their own
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
